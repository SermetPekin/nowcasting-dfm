[tox]
# List the Python versions you want to test against.
# Using 3.10 and 3.14 to cover the enterprise floor and modern bleeding-edge ceiling.
envlist = py310, py314
isolated_build = True

[testenv]
description = Run Pytest test suite to ensure mathematical cross-version stability
allowlist_externals = uv
# Tell tox to use the uv executable to resolve and build super fast instead of pip
install_command = uv pip install {opts} {packages}
deps =
    pytest>=8.0.0
    numba>=0.59.0
    numpy<2.6.0
    pandas>=2.0.0
    scipy>=1.10.0
    plotly>=5.18.0
commands =
    pytest dfm_sp/tests/ -v
